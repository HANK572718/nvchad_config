# =====================================================
# tmux.conf — 跨平台可攜設定（此 repo 的 single source of truth）
# 由 script/setup-devtools.sh --tmux 部署到 ~/.tmux.conf
# 對應 tmux 3.x（本機以 tmux 3.5a 驗證）
# =====================================================

# --- 終端相容性 ---
# 正確傳遞 xterm Alt 鍵序列（修正 Alt+i 等 Alt 鍵在 Neovim 中被吃掉的問題）
set -g xterm-keys on
# 縮短 Esc 等待，避免 nvim 內 <Esc> 有延遲
set -g escape-time 10

# 開啟滑鼠支援（支援 Blink Shell / 觸控滾動）
set -g mouse on

# Copy mode 使用 vi 按鍵
set -g mode-keys vi

# 256 色 / True Color
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# --- 視窗 / pane 行為 ---
# 從 1 開始編號（配合下方 Alt+數字切換更直覺）
set -g base-index 1
setw -g pane-base-index 1
# 關掉一個 window 後自動重新編號
set -g renumber-windows on
# 捲動歷史行數
set -g history-limit 10000

# --- 狀態列 ---
set -g status-interval 5
set -g status-left "[#S] "
set -g status-right "%H:%M %d-%b"

# --- 按鍵綁定：pane 切換（vim 風格，需 prefix）---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- 按鍵綁定：分割視窗（保留當前路徑）---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# 快速重載設定
bind r source-file ~/.tmux.conf \; display "Reloaded!"
# choose-tree 按名稱排序
bind s choose-tree -s -O name

# --- 免 prefix 的全域快捷鍵 ---
# Alt+Shift+1~9 直接切換 window（不需先按 prefix）
bind-key -n M-! select-window -t 1
bind-key -n M-@ select-window -t 2
bind-key -n M-# select-window -t 3
bind-key -n M-$ select-window -t 4
bind-key -n M-% select-window -t 5
bind-key -n M-^ select-window -t 6
bind-key -n M-& select-window -t 7
bind-key -n M-* select-window -t 8
bind-key -n M-( select-window -t 9

# Ctrl+Shift+← / → 把當前 window 往左 / 右搬並跟隨
bind-key -n C-S-Left  swap-window -t -1 \; select-window -t -1
bind-key -n C-S-Right swap-window -t +1 \; select-window -t +1

# --- Plugins（tpm）---
# 首次使用需先安裝 tpm，然後 prefix + I 安裝插件
# （script/setup-devtools.sh --tmux 會自動處理）
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # 儲存 / 還原 session（prefix + Ctrl-s / Ctrl-r）

# tpm 初始化：務必放在檔案「最後一行」
run '~/.tmux/plugins/tpm/tpm'
