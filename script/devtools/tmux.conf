# =====================================================
# tmux.conf — 跨平台可攜設定（此 repo 的 single source of truth）
# 由 script/setup-devtools.sh --tmux 部署到 ~/.tmux.conf
# 對應 tmux 3.x（本機以 tmux 3.5a 驗證）
# =====================================================

# --- 終端相容性 ---
# 正確傳遞 xterm Alt 鍵序列（修正 Alt+i 等 Alt 鍵在 Neovim 中被吃掉的問題）
set -g xterm-keys on
# 縮短 Esc 等待，避免 nvim 內 <Esc> 有延遲
set -g escape-time 10

# 開啟滑鼠支援（支援 Blink Shell / 觸控滾動）
set -g mouse on

# Copy mode 使用 vi 按鍵
set -g mode-keys vi

# 256 色 / True Color
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# --- 終端圖形協定（Kitty graphics）---
# 讓 tmux 內的程式能顯示圖片：yazi 預覽、nvim 的 image.nvim、chafa -f kitty。
#
# 1) allow-passthrough：Kitty 圖形協定走 APC escape sequence，tmux 預設會把不認得的
#    序列整個吃掉。開了才會原樣轉發給終端。tmux 3.3a+ 才有此選項。
#    註：yazi 啟動時會把這個值改成 "all"（比 "on" 更寬鬆），屬正常行為。
#    image.nvim 早期版本只認 "on"，開過 yazi 後會誤判成沒開；本 repo 釘的版本
#    （lua/image/utils/tmux.lua）已同時接受 on / all，不受影響。
set -g allow-passthrough on

# 2) 轉發 TERM / TERM_PROGRAM：yazi 靠這兩個環境變數判斷該用哪種圖形協定。
#    tmux 預設會把 TERM 改寫成 tmux-256color，不轉發的話 yazi 認不出外層是
#    Ghostty，會退回字元模式。
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# 3) image.nvim 另外要求的兩項（README「Tmux」章節）：
#    focus-events：讓 nvim 知道終端獲得/失去焦點，image.nvim 靠它決定何時
#                  重繪／隱藏圖片。預設是 off，不開圖會畫不出來或殘留。
#    visual-activity：關掉活動提示，否則 tmux 會在圖片區域插入訊息把圖打斷。
set-option -g focus-events on
set -g visual-activity off

# 註：Ghostty 刻意不支援 Sixel（官方 discussion #2496），只走 Kitty 協定；
#     而 Kitty「舊」協定在 tmux 下因協定本身限制無法運作，yazi 會自動改用
#     Kitty unicode placeholders。這條路是 Ghostty + tmux 唯一可行的組合。
#     改完此檔需 `tmux kill-server` 才會生效（reload 不夠）。

# --- 視窗 / pane 行為 ---
# 從 1 開始編號（配合下方 Alt+數字切換更直覺）
set -g base-index 1
setw -g pane-base-index 1
# 關掉一個 window 後自動重新編號
set -g renumber-windows on
# 捲動歷史行數
set -g history-limit 10000

# --- 狀態列 ---
set -g status-interval 5
set -g status-left "[#S] "
set -g status-right "%H:%M %d-%b"

# --- 按鍵綁定：pane 切換（vim 風格，需 prefix）---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- 按鍵綁定：分割視窗（保留當前路徑）---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# 快速重載設定
bind r source-file ~/.tmux.conf \; display "Reloaded!"
# choose-tree 按名稱排序
bind s choose-tree -s -O name

# --- 免 prefix 的全域快捷鍵 ---
# Alt+Shift+1~9 直接切換 window（不需先按 prefix）
bind-key -n M-! select-window -t 1
bind-key -n M-@ select-window -t 2
bind-key -n M-# select-window -t 3
bind-key -n M-$ select-window -t 4
bind-key -n M-% select-window -t 5
bind-key -n M-^ select-window -t 6
bind-key -n M-& select-window -t 7
bind-key -n M-* select-window -t 8
bind-key -n M-( select-window -t 9

# Ctrl+Shift+← / → 把當前 window 往左 / 右搬並跟隨
bind-key -n C-S-Left  swap-window -t -1 \; select-window -t -1
bind-key -n C-S-Right swap-window -t +1 \; select-window -t +1

# --- Plugins（tpm）---
# 首次使用需先安裝 tpm，然後 prefix + I 安裝插件
# （script/setup-devtools.sh --tmux 會自動處理）
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # 儲存 / 還原 session（prefix + Ctrl-s / Ctrl-r）

# tpm 初始化：務必放在檔案「最後一行」
run '~/.tmux/plugins/tpm/tpm'
